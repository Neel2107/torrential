plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.torrential'
version = '0.1.0'

expoModule {
  v2 true
}

android {
  namespace "expo.modules.torrentialengine"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
  packagingOptions {
    // React Native ships libc++_shared.so; the engine links against the same one.
    pickFirst '**/libc++_shared.so'
  }
}
